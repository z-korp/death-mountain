<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<meta name="robots" content="noindex" />
<title>Loot Survivor — The Gates Are Sealed</title>
<meta name="description" content="The dungeon is sealed while the realm is rewritten. Loot Survivor will reopen soon." />

<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="preload" href="/banner.png" as="image" />
<link rel="preload" href="/images/mobile/logo_nobg.png" as="image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700;900&family=VT323&display=swap" rel="stylesheet" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Loot Survivor — The Gates Are Sealed" />
<meta property="og:description" content="The dungeon is sealed while the realm is rewritten. Loot Survivor will reopen soon." />
<meta property="og:image" content="/banner.png" />
<meta property="twitter:card" content="summary_large_image" />
<meta property="twitter:image" content="/banner.png" />

<style>
  :root {
    --void:        #000000;
    --void-2:      #111111;
    --frame:       rgba(34, 34, 34, 1);
    --bone:        #e8dcc4;
    --bone-dim:    #a89980;
    --gold:        #FFE97F;
    --gold-deep:   #d7c529;
    --gold-shadow: #4a3a14;
    --lime:        #80FF00;
    --lime-soft:   rgba(128, 255, 0, 0.35);
    --lime-dim:    rgba(128, 255, 0, 0.18);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--void);
    color: var(--bone);
    font-family: "Cinzel", serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  body {
    position: relative;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: clamp(28px, 5vw, 64px) clamp(20px, 5vw, 48px) clamp(72px, 9vw, 120px);
    isolation: isolate;
  }

  /* Atmosphere layer 1: real game banner art with strong vertical mask */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.55) 0%,
        rgba(0, 0, 0, 0.65) 35%,
        rgba(0, 0, 0, 0.88) 65%,
        #000 100%
      ),
      url("/banner.png") center top / cover no-repeat,
      var(--void);
    z-index: -3;
  }

  /* Atmosphere layer 2: ambient lime glow that merges with the portal in the banner */
  body > .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -2;
    background: radial-gradient(
      ellipse 55% 38% at 50% 32%,
      rgba(128, 255, 0, 0.22) 0%,
      rgba(128, 255, 0, 0.08) 35%,
      rgba(0, 0, 0, 0) 65%
    );
    animation: lime-pulse 6s ease-in-out infinite;
    mix-blend-mode: screen;
  }

  /* Atmosphere layer 3: grain */
  body > .grain {
    position: fixed;
    inset: -20%;
    pointer-events: none;
    z-index: -2;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.85  0 0 0 0 0.5  0 0 0 0.16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: overlay;
    opacity: 0.32;
  }

  /* Atmosphere layer 4: scanlines */
  body > .veil {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(128, 255, 0, 0.025) 0px,
      rgba(128, 255, 0, 0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: screen;
  }

  @keyframes lime-pulse {
    0%, 100% { opacity: 1;    }
    50%      { opacity: 0.62; }
  }

  /* ── Composition ─────────────────────────────────────── */

  main {
    width: 100%;
    max-width: 720px;
    text-align: center;
    position: relative;
  }

  .wordmark {
    display: flex;
    justify-content: center;
    margin: 0 auto clamp(28px, 5vw, 44px);
    animation: rise 1.1s 0.05s cubic-bezier(.2,.7,.2,1) backwards;
  }

  .wordmark img {
    width: clamp(220px, 36vw, 360px);
    height: auto;
    display: block;
    filter:
      drop-shadow(0 0 22px rgba(128, 255, 0, 0.28))
      drop-shadow(0 6px 18px rgba(0, 0, 0, 0.7));
  }

  .eyebrow {
    font-family: "VT323", monospace;
    font-size: clamp(14px, 1.6vw, 16px);
    letter-spacing: 0.42em;
    color: var(--gold-deep);
    text-transform: uppercase;
    margin: 0 0 clamp(18px, 3vw, 24px);
    animation: rise 1.1s 0.18s cubic-bezier(.2,.7,.2,1) backwards;
  }

  .eyebrow::before, .eyebrow::after {
    content: "·";
    margin: 0 0.8em;
    color: var(--gold-shadow);
  }

  h1 {
    margin: 0;
    font-family: "Cinzel", serif;
    font-weight: 900;
    font-size: clamp(40px, 7.6vw, 84px);
    line-height: 0.98;
    letter-spacing: 0.04em;
    color: var(--gold);
    text-transform: uppercase;
    text-shadow:
      0 0 1px rgba(255, 233, 127, 0.45),
      0 0 32px rgba(128, 255, 0, 0.18),
      0 2px 0 rgba(0, 0, 0, 0.7);
    animation: rise 1.2s 0.28s cubic-bezier(.2,.7,.2,1) backwards;
  }

  h1 .amp {
    display: inline-block;
    color: var(--lime);
    font-weight: 400;
    font-style: italic;
    transform: translateY(-0.04em);
    margin: 0 0.05em;
    text-shadow: 0 0 26px rgba(128, 255, 0, 0.55);
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: clamp(22px, 4vw, 32px) auto;
    animation: rise 1.2s 0.42s cubic-bezier(.2,.7,.2,1) backwards;
  }
  .divider .line {
    height: 1px;
    width: clamp(60px, 16vw, 140px);
    background: linear-gradient(
      to var(--dir, right),
      transparent 0%,
      var(--gold-shadow) 30%,
      var(--gold-deep) 100%
    );
  }
  .divider .line.right { --dir: left; }
  .divider .diamond {
    width: 8px;
    height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
    box-shadow:
      0 0 0 1px var(--gold-shadow),
      0 0 18px rgba(255, 233, 127, 0.5);
  }

  .proclamation {
    font-family: "Cinzel", serif;
    font-weight: 500;
    font-size: clamp(15px, 1.7vw, 18px);
    line-height: 1.7;
    letter-spacing: 0.02em;
    color: var(--bone);
    max-width: 52ch;
    margin: 0 auto clamp(36px, 6vw, 56px);
    animation: rise 1.2s 0.56s cubic-bezier(.2,.7,.2,1) backwards;
  }

  .proclamation em {
    font-style: italic;
    color: var(--gold);
  }

  /* ── Terminal block: corrupted system readout (game's container shell + lime pulse) ── */

  .readout {
    border: 1px solid var(--lime-soft);
    background:
      linear-gradient(180deg, rgba(128, 255, 0, 0.04), rgba(0, 0, 0, 0)),
      var(--void-2);
    padding: 18px clamp(18px, 3vw, 26px) 20px;
    text-align: left;
    font-family: "VT323", monospace;
    font-size: clamp(15px, 1.9vw, 19px);
    line-height: 1.45;
    color: var(--bone);
    letter-spacing: 0.02em;
    position: relative;
    max-width: 560px;
    margin: 0 auto;
    box-shadow: 0 0 6px rgba(128, 255, 0, 0.2);
    animation:
      rise 1.2s 0.7s cubic-bezier(.2,.7,.2,1) backwards,
      greenGlow 2s 0.7s ease-in-out infinite;
  }

  .readout::before {
    content: "[ system : loot_survivor ]";
    position: absolute;
    top: -10px; left: 18px;
    background: var(--void);
    padding: 0 10px;
    font-size: 13px;
    color: var(--lime);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .readout .row {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 14px;
  }

  .readout .row + .row { margin-top: 4px; }

  .readout .key  { color: var(--lime); }
  .readout .val  { color: var(--bone); }
  .readout .val.warn { color: var(--gold-deep); }

  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    vertical-align: -0.12em;
    background: var(--lime);
    margin-left: 6px;
    animation: blink 1.05s steps(2) infinite;
  }
  @keyframes blink {
    0%, 49%  { opacity: 1; }
    50%, 100%{ opacity: 0; }
  }

  /* Canonical greenGlow keyframe — matches StartPage.tsx CTA pulse */
  @keyframes greenGlow {
    0%, 100% { box-shadow: 0 0 6px rgba(128, 255, 0, 0.2); }
    50%      { box-shadow: 0 0 14px rgba(128, 255, 0, 0.4); }
  }

  /* ── Footer mark ─────────────────────────────────────── */

  footer {
    position: fixed;
    bottom: 18px; left: 0; right: 0;
    text-align: center;
    font-family: "VT323", monospace;
    font-size: 14px;
    letter-spacing: 0.32em;
    color: var(--bone-dim);
    text-transform: uppercase;
    opacity: 0.7;
  }
  footer span { color: var(--gold-deep); }

  /* ── Reveal ───────────────────────────────────────── */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0);     filter: blur(0); }
  }

  /* ── Reduced motion ───────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  /* ── Mobile tightening ────────────────────────────── */
  @media (max-width: 480px) {
    .divider .line { width: 48px; }
    .readout .row { grid-template-columns: 80px 1fr; }
    footer { letter-spacing: 0.22em; font-size: 12px; }
  }
</style>
</head>

<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>

  <main role="main">
    <div class="wordmark">
      <img src="/images/mobile/logo_nobg.png" alt="Loot Survivor 2" width="360" height="140" />
    </div>

    <p class="eyebrow">By order of the Realm</p>

    <h1>The Gates <span class="amp">are</span> Sealed</h1>

    <div class="divider" aria-hidden="true">
      <span class="line"></span>
      <span class="diamond"></span>
      <span class="line right"></span>
    </div>

    <p class="proclamation">
      The dungeon is being <em>rewritten</em>. Sharpen your blades. The descent will resume.
    </p>

    <section class="readout" aria-label="System status">
      <div class="row">
        <span class="key">status</span>
        <span class="val warn">migrating</span>
      </div>
      <div class="row">
        <span class="key">phase</span>
        <span class="val">rewriting the realm</span>
      </div>
      <div class="row">
        <span class="key">eta</span>
        <span class="val">when the stars align</span>
      </div>
      <div class="row">
        <span class="key">ritual</span>
        <span class="val">in progress<span class="cursor" aria-hidden="true"></span></span>
      </div>
    </section>
  </main>

  <footer>
    Loot Survivor <span>·</span> Death Mountain <span>·</span> Forging
  </footer>
</body>
</html>
